name: SafeHands CI

on:
  push:
  pull_request:

jobs:
  # ── Hermetic gate: no live-network dependency. Must be green to merge. ──
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      WALLET_MODE: none
      WRITE_TOOLS_ENABLED: "false"
      SAFE_EXECUTE_ENABLED: "false"
      MANAGED_WALLET_ENABLED: "false"
      ALLOW_LOCAL_X402_FETCH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:test
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package:anvita
      - run: npm run test:contracts

  # ── Live mainnet smoke: hits public Pharos RPC (read-only, never broadcasts). ──
  # Non-gating: a public-RPC outage must not block merges. Runs after the gate.
  live-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    env:
      NODE_ENV: test
      WALLET_MODE: none
      WRITE_TOOLS_ENABLED: "false"
      SAFE_EXECUTE_ENABLED: "false"
      MANAGED_WALLET_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:live
